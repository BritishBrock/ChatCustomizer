
<form  [formGroup]="stylesForm">
  @for(form of stylesForm.controls|keyvalue;track $index){
    <div class="section">
      <div class="header">
        {{form.key | titlecase}}
        @if (isOpen[$index]) {

          <div class="downButton" (click)="isOpen[$index] = !isOpen[$index]" style="float: right;">-</div>
        } @if (!isOpen[$index]) {
          <div class="downButton" (click)="isOpen[$index] = !isOpen[$index]" style="float: right;">+</div>

        }
      </div>
      @if (isOpen[$index]) {
        <div class="styles" >

          <div class="style" *ngFor="let style of form.value.controls| keyvalue;">
            <div class="style-header">
              {{style.key}}
            </div>
            <div class="style-body">
                    @switch (typeMap[style.key]) {
                      @case ("text") {
                       <app-text  [formGroupName]="form.key" [formGroup]="stylesForm"  [controlname]="style.key"></app-text>
                      }
                      @case ("color") {
                        <app-color  [formGroupName]="form.key" [formGroup]="stylesForm"  [controlname]="style.key"></app-color>
                      }
                      @case ("multi") {
                        <app-multi [formGroupName]="form.key" [formGroup]="stylesForm"  [controlname]="style.key"></app-multi>
                      }
                    }
            </div>
            <button (click)="removeStyle(form.key,style.key)">remove</button>
          </div>
        </div>
        <select [ngModelOptions]="{standalone: true}" [(ngModel)]="cssSelected" name="" id="">
          @for(items of cssProprties;track $index){
            <option [value]="items">{{items}}</option>
          }
        </select>
        <button (click)="addStyle(form.key)">Add Style +</button>
      }
    </div>
  }
</form>
